<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d14" />
    <title>Workout Tracker · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #090d14; color: #f2eee5; }
      main { width: min(100% - 40px, 620px); }
      span { color: #4f74ff; font: 700 11px/1.4 "SFMono-Regular", Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 14px 0 20px; font-size: clamp(48px, 12vw, 82px); letter-spacing: -.06em; line-height: .94; }
      p { max-width: 500px; margin: 0; color: #9aa6b6; font-size: 18px; line-height: 1.55; }
      button { min-height: 52px; margin-top: 32px; padding: 0 24px; border: 0; background: #4f74ff; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span>Connection needed</span>
      <h1>You’re offline.</h1>
      <p>Reconnect to load your private routines and securely save workout progress.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
